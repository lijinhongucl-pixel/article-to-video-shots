[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "article-to-video-shots"
version = "1.2.1"
description = "把长文拆成可直接投喂文生视频模型的分镜脚本，一键接入 WorkBuddy / Claude Code / Cursor 等 Agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "社交名流UCL" }]
keywords = ["ai", "video", "storyboard", "prompt", "skill", "agent", "claude-code", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/lijinhongucl-pixel/article-to-video-shots"
Repository = "https://github.com/lijinhongucl-pixel/article-to-video-shots"
Changelog = "https://github.com/lijinhongucl-pixel/article-to-video-shots/blob/main/CHANGELOG.md"
Issues = "https://github.com/lijinhongucl-pixel/article-to-video-shots/issues"

[project.scripts]
avs = "avs_cli.cli:main"

[tool.setuptools]
packages = ["avs_cli"]

[tool.setuptools.package-data]
avs_cli = [
    "adapters.json",
    "skill/**/*",
    "skill/SKILL.md",
    "skill/scripts/*.py",
    "skill/references/*.md",
]
