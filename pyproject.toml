[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "article-to-video-shots"
version = "1.2.0"
description = "长文转短视频分镜：把公众号推文、博客、测评稿拆成带时间轴的分镜脚本，含中英文提示词、口播配音、字幕与体检工具"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "lijinhongucl-pixel" }]
keywords = ["ai", "video", "ai-video", "storyboard", "prompt", "text-to-video", "agent-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/lijinhongucl-pixel/article-to-video-shots"
Repository = "https://github.com/lijinhongucl-pixel/article-to-video-shots"
Changelog = "https://github.com/lijinhongucl-pixel/article-to-video-shots/blob/main/CHANGELOG.md"

[project.scripts]
avs = "avs_cli.cli:main"

[tool.setuptools]
packages = ["avs_cli"]

[tool.setuptools.package-data]
avs_cli = [
    "adapters.json",
    "skill/SKILL.md",
    "skill/scripts/*.py",
    "skill/references/*.md",
]
