name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m compileall -q avs_cli

      - name: 安装 CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: 检查命令可用
        run: |
          avs --version
          avs list --all

      - name: 端到端回归
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e
          printf '# 标题\n\n图片來自測試。\n\n## 一节\n\n内容一。\n\n## 二节\n\n内容二。\n' > art.md
          avs install --dir /tmp/e2e/target
          test -f /tmp/e2e/target/article-to-video-shots/SKILL.md
          python /tmp/e2e/target/article-to-video-shots/scripts/init_storyboard.py art.md --duration 45 --out sb.md
          python /tmp/e2e/target/article-to-video-shots/scripts/check_storyboard.py sb.md --strict > /dev/null || true
          python /tmp/e2e/target/article-to-video-shots/scripts/check_storyboard.py sb.md | grep -q "E9" && echo "占位符检查正常"

      - name: 卸载验证
        run: |
          avs uninstall --agent cursor
          echo ok
